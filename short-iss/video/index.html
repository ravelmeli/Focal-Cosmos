      #title { position: absolute; left: 0; right: 0; top: 90px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 130px; letter-spacing: .55em; padding-left: .55em; color: #fff; opacity: 0; z-index: 6; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
    </style>

    <script>
      // ----- habillage 2D : pastilles (depuis assets/pills.js), jauge, transitions -----
      const card = document.getElementById("card");
      for (const p of window.PILLS) {
        const lead = !(p.anc.k === "scr");
        if (lead) {
          const ld = document.createElement("div"); ld.className = "ld " + p.cls; ld.id = "ld-" + p.id; card.insertBefore(ld, document.getElementById("dip"));
          const ad = document.createElement("div"); ad.className = "ad " + p.cls; ad.id = "ad-" + p.id; card.insertBefore(ad, document.getElementById("dip"));
        }
        const pw = document.createElement("div"); pw.className = "pw"; pw.id = "pw-" + p.id;
        pw.innerHTML = '<span class="pill ' + p.cls + '" id="pl-' + p.id + '">' + (p.txt || "") + "</span>";
        card.insertBefore(pw, document.getElementById("dip"));
      }
      const tl = gsap.timeline({ paused: true });
      for (const p of window.PILLS) {
        tl.fromTo("#pl-" + p.id, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, p.t0);
        tl.to("#pl-" + p.id, { opacity: 0, duration: 0.15, ease: "power2.in" }, p.t1 - 0.15);
        if (p.anc.k !== "scr") {
          tl.fromTo("#ld-" + p.id + ", #ad-" + p.id, { opacity: 0 }, { opacity: 0.95, duration: 0.2 }, p.t0 + 0.05);
          tl.to("#ld-" + p.id + ", #ad-" + p.id, { opacity: 0, duration: 0.15 }, p.t1 - 0.15);
        }
      }
      tl.fromTo("#tag-left, #tag-right", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);
      for (const [a, b] of [[0.4, 1.4], [8.6, 9.9], [78.9, 82.2]]) {
        tl.to("#scale-note", { opacity: 1, duration: 0.3 }, a);
        tl.to("#scale-note", { opacity: 0, duration: 0.2 }, b);
      }
      tl.fromTo("#gauge", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3 }, 10.6);
      tl.fromTo("#g1", { width: "0%" }, { width: "100%", duration: 0.6, ease: "power3.out" }, 10.7);
      tl.fromTo("#g2", { width: "0%" }, { width: "90%", duration: 0.7, ease: "power3.out" }, 11.5);
      tl.to("#gauge", { opacity: 0, duration: 0.2 }, 12.95);
      tl.fromTo("#qmark", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 14.9);
      tl.to("#qmark", { opacity: 0, duration: 0.15 }, 15.9);
      tl.fromTo("#title", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 83.4);
      for (const c of window.CUTS) {
        tl.fromTo("#dip", { opacity: 0 }, { opacity: 0.8, duration: 0.12, ease: "power1.in" }, c - 0.12);
        tl.to("#dip", { opacity: 0, duration: 0.18, ease: "power1.out" }, c);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>

    <script type="importmap">{ "imports": { "three": "./lib/three/three.module.min.js" } }</script>
    <script type="module">
      import * as THREE from "three";

      // ---------- utilitaires deterministes ----------
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
      const lerp = (a, b, k) => a + (b - a) * k;
      function hash3(x, y, z, seed) { let h = (x * 374761393 + y * 668265263 + z * 2147483647 + seed * 1274126177) | 0; h = (h ^ (h >>> 13)) * 1274126177; h = h ^ (h >>> 16); return (h >>> 0) / 4294967296; }
      function vnoise(x, y, z, seed) {
        const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
        const u = smooth(xf), v = smooth(yf), w = smooth(zf);
        const c = (a, b, d) => hash3(xi + a, yi + b, zi + d, seed);
        return lerp(lerp(lerp(c(0,0,0), c(1,0,0), u), lerp(c(0,1,0), c(1,1,0), u), v), lerp(lerp(c(0,0,1), c(1,0,1), u), lerp(c(0,1,1), c(1,1,1), u), v), w);
      }
      function fbm(x, y, z, seed, oct = 5) { let a = 0.5, s = 0, f = 1; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f, seed + i); f *= 2.05; a *= 0.5; } return s; }
      const fmtInt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

      const W = 1040, H = 1030;
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x050914, 1);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, W / H, 0.05, 600);

      const R = 10, RO0 = 11.5;
      const SUN_BASE = Math.atan2(0.55, 1);
      const SUN = new THREE.Vector3(Math.cos(SUN_BASE), 0.25, Math.sin(SUN_BASE)).normalize();

      // ---------- materiaux "toon" (rendu plat illustre) ----------
      const grad = new THREE.DataTexture(new Uint8Array([85, 150, 215, 255]), 4, 1, THREE.RedFormat);
      grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
      const toon = (color, emissive = 0x000000, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: grad, emissive, ...extra });

      // ---------- Terre stylisee (textures procedurales) ----------
      function buildEarthTextures() {
        const tw = 1024, th = 512;
        const day = document.createElement("canvas"); day.width = tw; day.height = th;
        const night = document.createElement("canvas"); night.width = tw * 2; night.height = th * 2;
        const dc = day.getContext("2d"), nc = night.getContext("2d");
        const di = dc.createImageData(tw, th);
        nc.fillStyle = "#04081a"; nc.fillRect(0, 0, tw * 2, th * 2);
        const landMask = new Uint8Array(tw * th);
        const dots = [];
        const rnd = mulberry32(7);
        const q = (v, steps) => Math.floor(v * steps) / steps;
        for (let j = 0; j < th; j++) {
          const lat = (0.5 - (j + 0.5) / th) * Math.PI;
          for (let i = 0; i < tw; i++) {
            const lon = ((i + 0.5) / tw) * Math.PI * 2 - Math.PI;
            const x = Math.cos(lat) * Math.cos(lon), y = Math.sin(lat), z = Math.cos(lat) * Math.sin(lon);
            const n = fbm(x * 1.7 + 3, y * 1.7 + 3, z * 1.7 + 3, 11);
            const isLand = n > 0.53;
            const alat = Math.abs(lat) / (Math.PI / 2);
            const ice = alat > 0.86;
            const mois = fbm(x * 3 + 9, y * 3 + 9, z * 3 + 9, 31, 3);
            let r, g, b;
            if (isLand) {
              const dry = q(clamp01((0.6 - mois) * 4), 3);
              r = lerp(58, 188, dry); g = lerp(128, 148, dry); b = lerp(66, 84, dry);
            } else {
              const shallow = q(clamp01((n - 0.42) / 0.11), 3);
              r = lerp(8, 30, shallow); g = lerp(46, 110, shallow); b = lerp(112, 178, shallow);
            }
            if (ice) { r = 236; g = 243; b = 250; }
            const cl = fbm(x * 3.6 + 50, y * 3.6 + 50, z * 3.6 + 50, 77, 4);
            if (cl > 0.67) { r = lerp(r, 248, 0.55); g = lerp(g, 250, 0.55); b = lerp(b, 255, 0.55); }
            const k = (j * tw + i) * 4;
            di.data[k] = r; di.data[k + 1] = g; di.data[k + 2] = b; di.data[k + 3] = 255;
            if (isLand && !ice) {
              landMask[j * tw + i] = 1;
              const cityN = fbm(x * 8 + 100, y * 8 + 100, z * 8 + 100, 5, 3);
              if (cityN > 0.52 && rnd() < 0.10 + (cityN - 0.52) * 1.6) dots.push([i, j, 0.5 + 0.5 * rnd()]);
            }
          }
        }
        dc.putImageData(di, 0, 0);
        // silhouette des terres la nuit + points de villes
        nc.fillStyle = "#0a1330";
        for (let j = 0; j < th; j++) for (let i = 0; i < tw; i++) if (landMask[j * tw + i]) nc.fillRect(i * 2, j * 2, 2, 2);
        nc.shadowColor = "rgba(255,170,60,0.9)"; nc.shadowBlur = 3;
        for (const [i, j, s] of dots) { nc.fillStyle = "rgba(255," + Math.round(190 + 40 * s) + "," + Math.round(90 + 60 * s) + ",1)"; nc.beginPath(); nc.arc(i * 2 + 1, j * 2 + 1, 0.8 + 0.8 * s, 0, Math.PI * 2); nc.fill(); }
        const mk = (c) => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
        return { day: mk(day), night: mk(night) };
      }
      const earthUniforms = { dayMap: { value: null }, nightMap: { value: null }, sun: { value: SUN } };
      const earthMat = new THREE.ShaderMaterial({
        uniforms: earthUniforms,
        vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
          void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.); vV=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`,
        fragmentShader: `uniform sampler2D dayMap; uniform sampler2D nightMap; uniform vec3 sun; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
          void main(){
            vec3 n=normalize(vN);
            float ndl=dot(n,sun);
            float d=smoothstep(-0.015,0.05,ndl);
            float shade=0.62+0.38*smoothstep(0.12,0.4,ndl);
            vec3 day=texture2D(dayMap,vUv).rgb*shade;
            vec3 night=texture2D(nightMap,vUv).rgb*1.5;
            vec3 col=mix(night,day,d);
            float rim=pow(1.-max(dot(n,vV),0.),4.);
            col+=vec3(0.25,0.7,1.0)*rim*(0.1+0.5*d);
            gl_FragColor=vec4(col,1.);
          }`,
      });
      const atmoMat = new THREE.ShaderMaterial({
        uniforms: { sun: { value: SUN } },
        vertexShader: `varying vec3 vN; varying vec3 vV;
          void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.); vV=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`,
        fragmentShader: `uniform vec3 sun; varying vec3 vN; varying vec3 vV;
          void main(){ float f=pow(max(0.5-dot(normalize(vN),vV),0.),3.0)*5.0; float l=0.45+0.55*smoothstep(-0.3,0.4,dot(normalize(vN),sun));
            gl_FragColor=vec4(vec3(0.35,0.75,1.0)*f*l,clamp(f*l,0.,1.)); }`,
        side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      });
      const tex = buildEarthTextures();
      earthUniforms.dayMap.value = tex.day; earthUniforms.nightMap.value = tex.night;
      const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), earthMat); scene.add(earth);
      const atmo = new THREE.Mesh(new THREE.SphereGeometry(R * 1.035, 64, 48), atmoMat); scene.add(atmo);

      // ---------- etoiles (suivent la camera) ----------
      const stars = (() => {
        const rnd = mulberry32(99), n = 1800, p = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) { const u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u), r = 250 + rnd() * 40; p[i*3] = r*s*Math.cos(a); p[i*3+1] = r*u; p[i*3+2] = r*s*Math.sin(a); }
        const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
        const pts = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xdbe6ff, size: 1.1, sizeAttenuation: true, transparent: true, opacity: 0.85, depthWrite: false }));
        scene.add(pts); return pts;
      })();

      // ---------- lumieres ----------
      const sunL = new THREE.DirectionalLight(0xfff1dd, 3.2); scene.add(sunL);
      scene.add(new THREE.HemisphereLight(0x5a78c8, 0x0a1022, 1.1));

      // ---------- ISS ----------
      function panelTexture() {
        const c = document.createElement("canvas"); c.width = 128; c.height = 64; const x = c.getContext("2d");
        x.fillStyle = "#1d4390"; x.fillRect(0, 0, 128, 64);
        x.strokeStyle = "#4f86e0"; x.lineWidth = 2;
        for (let i = 0; i <= 128; i += 16) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 64); x.stroke(); }
        for (let j = 0; j <= 64; j += 16) { x.beginPath(); x.moveTo(0, j); x.lineTo(128, j); x.stroke(); }
        x.strokeStyle = "#c9d8f5"; x.lineWidth = 3; x.strokeRect(1, 1, 126, 62);
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
      }
      const iss = new THREE.Group();
      {
        const white = toon(0xf1f4fa), grey = toon(0x9aa5ba), gold = toon(0xe0a83c, 0x2a1a00);
        const panel = toon(0xffffff, 0x0c1c44, { map: panelTexture() });
        const cyl = (r, l, m, rot) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, l, 24), m); if (rot === "x") c.rotation.z = Math.PI / 2; if (rot === "z") c.rotation.x = Math.PI / 2; return c; };
        iss.add(new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.09, 0.09), grey));
        const m1 = cyl(0.17, 1.2, white, "z"); m1.position.set(0, -0.05, 0); iss.add(m1);
        const m2 = cyl(0.15, 0.95, white, "z"); m2.position.set(0.24, -0.05, 0.95); iss.add(m2);
        const m3 = cyl(0.15, 0.85, white, "z"); m3.position.set(-0.24, -0.05, -0.9); iss.add(m3);
        const m4 = cyl(0.12, 0.7, gold, "x"); m4.position.set(0, -0.05, 0.1); iss.add(m4);
        for (const zz of [-0.35, 0, 0.35]) { const ring = cyl(0.185, 0.04, grey, "z"); ring.position.set(0, -0.05, zz); iss.add(ring); }
        const dome = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), white); dome.position.set(0, 0.16, 0.1); iss.add(dome);
        const dish = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.1, 18), white); dish.position.set(-0.3, 0.2, -0.4); dish.rotation.x = Math.PI; iss.add(dish);
        for (const sx of [-1, 1]) {
          for (const sz of [-1, 1]) {
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.02, 0.4), panel); p.position.set(sx * 1.2, 0.0, sz * 0.3); iss.add(p);

      }

      // ---------- pastilles attachees aux objets ----------
      const ballPos = (idx) => trails[idx].ball.position.clone();
      function anchor(p, ctx) {
        const a = p.anc;
        switch (a.k) {
          case "iss": return loc(ctx.issPos, ctx.B, a.o || [0, 0, 0]);
          case "issmid": return ctx.issPos.clone().multiplyScalar(0.5 + (R / issRadius(0)) * 0.5);
          case "wrench": return ctx.wp.clone();
          case "canon": return CAN.clone();
          case "ball1": return ballPos(0); case "ball2": return ballPos(1); case "ball3": return ballPos(2);
          case "moon": return moon.position.clone();
          case "astroI": return ctx.aiPos.clone();
          case "flame": return ctx.fPos.clone();
          case "elev": return new THREE.Vector3(-300, ctx.ey + (a.dy || 0), 0);
          default: return null;
        }
      }
      function counterText(p, t) {
        const c = p.cnt;
        if (c.k === "alt") return altKm(t).toFixed(1).replace(".", ",") + " km";
        const k = smooth((t - c.t0) / (c.t1 - c.t0)); const v = lerp(c.from, c.to, k);
        return fmtInt(v) + (c.suf || "");
      }
      function updatePills(t, ctx) {
        for (const p of window.PILLS) {
          if (t < p.t0 - 0.05 || t > p.t1 + 0.05) continue;
          const pw = document.getElementById("pw-" + p.id), pl = document.getElementById("pl-" + p.id);
          if (p.cnt) { const s = counterText(p, t); if (pl.textContent !== s) pl.textContent = s; }
          if (p.anc.k === "scr") { pw.style.left = p.anc.x + "px"; pw.style.top = p.anc.y + "px"; continue; }
          const v = anchor(p, ctx); if (!v) continue;
          proj.copy(v).project(camera);
          const ax = (proj.x * 0.5 + 0.5) * W, ay = (-proj.y * 0.5 + 0.5) * H;
          const cx = Math.min(W - 170, Math.max(170, ax + p.off[0])), cy = Math.min(H - 110, Math.max(110, ay + p.off[1]));
          pw.style.left = cx + "px"; pw.style.top = cy + "px";
          const ld = document.getElementById("ld-" + p.id), ad = document.getElementById("ad-" + p.id);
          const dx = cx - ax, dy = cy - ay, len = Math.max(0, Math.hypot(dx, dy) - 36);
          ld.style.left = ax + "px"; ld.style.top = ay + "px"; ld.style.width = len + "px"; ld.style.transform = "rotate(" + Math.atan2(dy, dx) + "rad)";
          ad.style.left = ax + "px"; ad.style.top = ay + "px";
        }
      }

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["stage"] = Promise.resolve();
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
      window.__renderAt = renderAt;
    </script>
  </body>
</html>
