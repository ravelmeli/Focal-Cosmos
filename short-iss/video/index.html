    <script>
      // ----- habillage 2D : pastilles (depuis assets/pills.js), jauge, accroche, transitions -----
      const card = document.getElementById("card");
      for (const p of window.PILLS) {
        const lead = !(p.anc.k === "scr");
        if (lead) {
          const ld = document.createElement("div"); ld.className = "ld " + p.cls; ld.id = "ld-" + p.id; card.insertBefore(ld, document.getElementById("dip"));
          const ad = document.createElement("div"); ad.className = "ad " + p.cls; ad.id = "ad-" + p.id; card.insertBefore(ad, document.getElementById("dip"));
        }
        const pw = document.createElement("div"); pw.className = "pw"; pw.id = "pw-" + p.id;
        pw.innerHTML = '<span class="pill ' + p.cls + '" id="pl-' + p.id + '">' + (p.txt || "") + "</span>";
        card.insertBefore(pw, document.getElementById("dip"));
      }
      const tl = gsap.timeline({ paused: true });
      for (const p of window.PILLS) {
        tl.fromTo("#pl-" + p.id, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, p.t0);
        tl.to("#pl-" + p.id, { opacity: 0, duration: 0.15, ease: "power2.in" }, p.t1 - 0.15);
        if (p.anc.k !== "scr") {
          tl.fromTo("#ld-" + p.id + ", #ad-" + p.id, { opacity: 0 }, { opacity: 0.95, duration: 0.2 }, p.t0 + 0.05);
          tl.to("#ld-" + p.id + ", #ad-" + p.id, { opacity: 0, duration: 0.15 }, p.t1 - 0.15);
        }
      }
            for (const [a, b] of [[2.9, 3.4], [8.6, 9.9], [78.9, 82.2]]) {
        tl.to("#scale-note", { opacity: 1, duration: 0.3 }, a);
        tl.to("#scale-note", { opacity: 0, duration: 0.2 }, b);
      }
      // accroche : visible des la premiere image (miniature), puis revient en fin pour la boucle
      tl.to("#hook", { opacity: 0, duration: 0.35, ease: "power2.in" }, 2.5);
      tl.to("#hook", { opacity: 1, duration: 0.6, ease: "power2.out" }, 87.35);
      tl.fromTo("#gauge", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3 }, 10.6);
      tl.fromTo("#g1", { width: "0%" }, { width: "100%", duration: 0.6, ease: "power3.out" }, 10.7);
      tl.fromTo("#g2", { width: "0%" }, { width: "90%", duration: 0.7, ease: "power3.out" }, 11.5);
      tl.to("#gauge", { opacity: 0, duration: 0.2 }, 12.95);
      tl.fromTo("#qmark", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 14.9);
      tl.to("#qmark", { opacity: 0, duration: 0.15 }, 15.9);
      tl.fromTo("#title", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 83.4);
      tl.to("#title", { opacity: 0, duration: 0.35 }, 86.9);
      tl.fromTo("#cta", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 85.0);
      tl.to("#cta", { opacity: 0, duration: 0.3 }, 86.9);
      tl.fromTo("#prog-fill", { width: "0px" }, { width: "520px", duration: 88, ease: "none" }, 0);
      for (const c of window.CUTS) {
        tl.fromTo("#dip", { opacity: 0 }, { opacity: 0.55, duration: 0.1, ease: "power1.in" }, c - 0.1);
        tl.to("#dip", { opacity: 0, duration: 0.2, ease: "power1.out" }, c);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>

    <script type="importmap">{ "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }</script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

      // ---------- utilitaires deterministes ----------
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
      const lerp = (a, b, k) => a + (b - a) * k;
      const fmtInt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

      const W = 1040, H = 1030;
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x050914, 1);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, W / H, 0.05, 1200);

      const R = 10, RO0 = 11.5, LOOP = 88;
      const SUN_BASE = Math.atan2(0.55, 1);
      const SUN = new THREE.Vector3(Math.cos(SUN_BASE), 0.25, Math.sin(SUN_BASE)).normalize();

      // ---------- materiaux "toon" (rendu plat illustre) ----------
      const grad = new THREE.DataTexture(new Uint8Array([85, 150, 215, 255]), 4, 1, THREE.RedFormat);
      grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
      const toon = (color, emissive = 0x000000, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: grad, emissive, ...extra });

      // ---------- Terre : textures issues de la carte NASA (voir tools/build_earth.py) ----------
      const texLoader = new THREE.TextureLoader();
      const loadTex = (url) => texLoader.loadAsync(url).then((t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; });
      const earthUniforms = { dayMap: { value: null }, nightMap: { value: null }, sun: { value: SUN } };
      const earthMat = new THREE.ShaderMaterial({
        uniforms: earthUniforms,
        vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
          void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.); vV=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`,
        fragmentShader: `uniform sampler2D dayMap; uniform sampler2D nightMap; uniform vec3 sun; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
          void main(){
            vec3 n=normalize(vN);
            float ndl=dot(n,sun);
            float d=smoothstep(-0.015,0.05,ndl);
            float shade=0.78+0.22*smoothstep(0.12,0.4,ndl);
            vec3 day=texture2D(dayMap,vUv).rgb*shade;
            vec3 night=texture2D(nightMap,vUv).rgb*1.5;
            vec3 col=mix(night,day,d);
            float rim=pow(1.-max(dot(n,vV),0.),4.);
            col+=vec3(0.25,0.7,1.0)*rim*(0.06+0.32*d);
            gl_FragColor=vec4(col,1.);
          }`,
      });
      const atmoMat = new THREE.ShaderMaterial({
        uniforms: { sun: { value: SUN } },
        vertexShader: `varying vec3 vN; varying vec3 vV;
          void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.); vV=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`,
        fragmentShader: `uniform vec3 sun; varying vec3 vN; varying vec3 vV;
          void main(){ float f=pow(max(0.5-dot(normalize(vN),vV),0.),3.0)*3.4; float l=0.45+0.55*smoothstep(-0.3,0.4,dot(normalize(vN),sun));
            gl_FragColor=vec4(vec3(0.35,0.75,1.0)*f*l,clamp(f*l,0.,1.)); }`,
        side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      });
      const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), earthMat); earth.rotation.set(0.7, 1.4, 0); scene.add(earth);
      const atmo = new THREE.Mesh(new THREE.SphereGeometry(R * 1.035, 64, 48), atmoMat); scene.add(atmo);

      // ---------- ciel : carte d'etoiles NASA (Hipparcos), suit la camera ----------
      const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 32), new THREE.MeshBasicMaterial({ color: 0x3a4660, side: THREE.BackSide, depthWrite: false, fog: false }));
      sky.visible = false; scene.add(sky);
      const stars = (() => {
        const rnd = mulberry32(99), n = 1400, p = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) { const u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u), r = 700 + rnd() * 40; p[i*3] = r*s*Math.cos(a); p[i*3+1] = r*u; p[i*3+2] = r*s*Math.sin(a); }
        const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
        const pts = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xdbe6ff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.85, depthWrite: false }));
        scene.add(pts); return pts;
      })();

      // ---------- lumieres ----------
      const sunL = new THREE.DirectionalLight(0xfff1dd, 3.2); scene.add(sunL);
      scene.add(new THREE.HemisphereLight(0x6f8fe0, 0x0a1022, 1.15));
      const fill = new THREE.DirectionalLight(0x7aa2ff, 0.7); fill.position.set(-30, 10, -20); scene.add(fill);

      // ---------- modeles NASA (NASA-3D-Resources, sans copyright) ----------
      const iss = new THREE.Group(); scene.add(iss);
      const astroS = new THREE.Group(), astroI = new THREE.Group(), astroE = new THREE.Group(); scene.add(astroS, astroI, astroE);
      const wrench = new THREE.Group(); scene.add(wrench);

      function normalize(obj, target) {
        const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
        obj.position.sub(c); const g = new THREE.Group(); g.add(obj); g.scale.setScalar(target / Math.max(size.x, size.y, size.z)); return { g, size };
      }
      function panelTexture() {
        const c = document.createElement("canvas"); c.width = 128; c.height = 256; const x = c.getContext("2d");
        x.fillStyle = "#1d4390"; x.fillRect(0, 0, 128, 256);
        x.strokeStyle = "#4f86e0"; x.lineWidth = 2;
        for (let i = 0; i <= 128; i += 16) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 256); x.stroke(); }
        for (let j = 0; j <= 256; j += 16) { x.beginPath(); x.moveTo(0, j); x.lineTo(128, j); x.stroke(); }
        x.strokeStyle = "#c9d8f5"; x.lineWidth = 4; x.strokeRect(2, 2, 124, 252);
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
      }
      const panelMat = toon(0xffffff, 0x0c1c44, { map: panelTexture() });
      const draco = new DRACOLoader(); draco.setDecoderPath("./lib/three/draco/");
      const gltf = new GLTFLoader(); gltf.setDRACOLoader(draco);
      const toonify = (root, pick) => root.traverse((o) => {
        if (!o.isMesh) return;
        const m = o.material; const mk = (mm) => new THREE.MeshToonMaterial({ color: mm.color ? mm.color.clone() : 0xffffff, map: mm.map || null, gradientMap: grad });
        o.material = Array.isArray(m) ? m.map(mk) : mk(m);
        if (pick) pick(o);
      });

      const modelsReady = Promise.all([
        gltf.loadAsync("assets/models/iss.glb").then((m) => {
          const root = m.scene;
          // panneaux (grands elements plats) en bleu, le reste en blanc/gris clair
          toonify(root, (o) => {
            o.geometry.computeBoundingBox(); const s = o.geometry.boundingBox.getSize(new THREE.Vector3()); const d = [s.x, s.y, s.z].sort((a, b) => a - b);
            if (/^(bended|pCylinder)/.test(o.name)) { o.visible = false; return; }   // pieces parasites du modele (forment un gros nuage blanc)

        else { cp = new THREE.Vector3(c[0], c[1], c[2]); lk = new THREE.Vector3(c[3], c[4], c[5]); camera.up.set(0, 1, 0); if (shot.track) { cp.y += ey * shot.track; lk.y += ey * shot.track; } }
        camera.position.copy(cp); camera.lookAt(lk);
        // leger mouvement "a la main"
        camera.rotateX(0.0035 * Math.sin(t * 1.1)); camera.rotateY(0.0035 * Math.sin(t * 0.83 + 1)); camera.rotateZ(0.002 * Math.sin(t * 0.6));
        const fv = fovAt(t); if (Math.abs(camera.fov - fv) > 1e-4) { camera.fov = fv; camera.updateProjectionMatrix(); }
        camera.updateMatrixWorld(true);
        stars.position.copy(cp); sky.position.copy(cp);
        ctxState = { issPos, B, wp, aiPos, fPos, ey };
      }

      function renderAt(t) {
        const sh = blurShutter(t);
        if (sh > 0) {
          const n = 4;
          for (let s = 0; s < n; s++) {
            applyState(t - sh * (1 - s / (n - 1))); renderer.render(scene, camera);
            mbCtx.globalAlpha = 1 / (s + 1); mbCtx.drawImage(canvas, 0, 0);
          }
          mbCtx.globalAlpha = 1; mbCv.style.opacity = "1";
        } else { applyState(t); renderer.render(scene, camera); mbCv.style.opacity = "0"; }
        const src = sh > 0 ? mbCv : canvas;
        glowCtx.clearRect(0, 0, 180, 104); glowCtx.drawImage(src, 0, 440, 1040, 590, 0, 0, 180, 104);
        // bloom (seuil approche par contraste) + grain de film
        bloomCtx.clearRect(0, 0, 275, 272); bloomCtx.filter = "contrast(3.2) brightness(0.9) saturate(1.2)"; bloomCtx.drawImage(src, 0, 0, 275, 272); bloomCtx.filter = "none";
        { const rnd = mulberry32(Math.floor(t * 60) + 7), d = grainImg.data; for (let i = 0; i < d.length; i += 4) { const v = 128 + (rnd() - 0.5) * 150; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } grainCtx.putImageData(grainImg, 0, 0); }
        updatePills(t, ctxState);
      }

      // ---------- pastilles attachees aux objets ----------
      const ballPos = (idx) => trails[idx].ball.position.clone();
      function anchor(p, ctx) {
        const a = p.anc;
        switch (a.k) {
          case "iss": return loc(ctx.issPos, ctx.B, a.o || [0, 0, 0]);
          case "issmid": return ctx.issPos.clone().multiplyScalar(0.5 + (R / issRadius(0)) * 0.5);
          case "wrench": return ctx.wp.clone();
          case "canon": return CAN.clone();
          case "ball1": return ballPos(0); case "ball2": return ballPos(1); case "ball3": return ballPos(2);
          case "moon": return moonSprite.position.clone();
          case "astroI": return ctx.aiPos.clone();
          case "flame": return ctx.fPos.clone();
          case "elev": return new THREE.Vector3(-300, ctx.ey + (a.dy || 0), 0);
          default: return null;
        }
      }
      function counterText(p, t) {
        const c = p.cnt;
        if (c.k === "alt") return altKm(t).toFixed(1).replace(".", ",") + " km";
        const k = smooth((t - c.t0) / (c.t1 - c.t0)); const v = lerp(c.from, c.to, k);
        return fmtInt(v) + (c.suf || "");
      }
      function updatePills(t, ctx) {
        for (const p of window.PILLS) {
          if (t < p.t0 - 0.05 || t > p.t1 + 0.05) continue;
          const pw = document.getElementById("pw-" + p.id), pl = document.getElementById("pl-" + p.id);
          if (p.cnt) { const s = counterText(p, t); if (pl.textContent !== s) pl.textContent = s; }
          if (p.anc.k === "scr") { pw.style.left = p.anc.x + "px"; pw.style.top = p.anc.y + "px"; continue; }
          const v = anchor(p, ctx); if (!v) continue;
          proj.copy(v).project(camera);
          const ax = (proj.x * 0.5 + 0.5) * W, ay = (-proj.y * 0.5 + 0.5) * H;
          const cx = Math.min(W - 170, Math.max(170, ax + p.off[0])), cy = Math.min(H - 110, Math.max(110, ay + p.off[1]));
          pw.style.left = cx + "px"; pw.style.top = cy + "px";
          const ld = document.getElementById("ld-" + p.id), ad = document.getElementById("ad-" + p.id);
          const dx = cx - ax, dy = cy - ay, len = Math.max(0, Math.hypot(dx, dy) - 36);
          ld.style.left = ax + "px"; ld.style.top = ay + "px"; ld.style.width = len + "px"; ld.style.transform = "rotate(" + Math.atan2(dy, dx) + "rad)";
          ad.style.left = ax + "px"; ad.style.top = ay + "px";
        }
      }

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["stage"] = modelsReady.then(() => { renderAt(0); window.__hf.ready = true; });
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__renderAt = renderAt;
      window.__dbg = { renderer, camera, scene, wrench, moonSprite, iss, astroS, astroI, astroE, THREE };
      window.__inspect = () => ({ iss: window.__issMeshes, size: window.__issSize });
    </script>
  </body>
</html>
