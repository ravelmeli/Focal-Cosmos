<!doctype html>

  <head>

    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #050914;
        --card: #060b1a;
        --ink: #ffffff;
        --tag: #3ddc84;
        --muted: #8b94a8;

        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: absolute; inset: 0; overflow: hidden; font-family: var(--font-display); background: var(--ground); }
      #grid { position: absolute; inset: 0;
        background-image: linear-gradient(rgba(90,130,210,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(90,130,210,.07) 1px, transparent 1px);
        background-size: 54px 54px; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }
      #tag-left { position: absolute; left: 72px; top: 196px; font-family: var(--font-mono); font-weight: 700; font-size: 27px; letter-spacing: .13em; color: var(--tag); }
      #tag-right { position: absolute; right: 72px; top: 196px; font-family: var(--font-mono); font-weight: 500; font-size: 25px; letter-spacing: .22em; color: var(--muted); }
      #glow { position: absolute; left: 190px; top: 1560px; width: 700px; height: 360px; opacity: .38; filter: blur(46px); }
      #card { position: absolute; left: 20px; top: 320px; width: 1040px; height: 1030px; border-radius: 34px; overflow: hidden;
        background: var(--card); border: 2px solid rgba(255,255,255,.09); }
      #gl { position: absolute; inset: 0; width: 1040px; height: 1030px; }
      #dip { position: absolute; inset: 0; background: #050914; opacity: 0; }
      #scale-note { position: absolute; left: 0; right: 0; top: 26px; text-align: center; font-family: var(--font-mono); font-size: 21px; letter-spacing: .04em; color: #7e89a3; }
      .pill { position: absolute; font-family: var(--font-mono); font-weight: 700; font-size: 34px; padding: 10px 22px; border-radius: 14px; white-space: nowrap; opacity: 0; }
      .pill.y { background: var(--yellow); color: #1b1303; }
      .pill.b { background: var(--blue); color: #04202e; }
      .pill.g { background: var(--tag); color: #04230f; font-size: 26px; padding: 8px 16px; }
      .pill.r { background: var(--red); color: #2b0606; font-size: 26px; padding: 8px 16px; }
      #gauge { position: absolute; left: 64px; right: 64px; top: 700px; opacity: 0; font-family: var(--font-mono); }
      .gb { display: flex; align-items: center; margin-top: 22px; }
      .gl { width: 250px; font-size: 26px; font-weight: 700; color: #dfe6f5; letter-spacing: .05em; }
      .gt { flex: 1; height: 38px; border-radius: 10px; background: rgba(255,255,255,.08); overflow: hidden; }
      .gf { height: 100%; width: 0; border-radius: 10px; }
      .gv { width: 130px; text-align: right; font-size: 34px; font-weight: 700; }
      #qmark { position: absolute; right: 120px; top: 160px; font-family: var(--font-mono); font-weight: 700; font-size: 150px; color: var(--yellow); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-fps="30" data-width="1080" data-height="1920">
      <div id="grid"></div>
      <div id="vignette"></div>
      <canvas id="glow" width="140" height="72"></canvas>
      <div id="tag-left">ISS · ORBITE BASSE</div>
      <div id="tag-right">FOCAL COSMOS</div>
      <div id="card">
        <canvas id="gl" width="1040" height="1030"></canvas>
        <div id="scale-note">Terre et orbites · échelle non respectée</div>
        <div class="pill y" id="p-alt" style="left: 560px; top: 600px;">400 km</div>
        <div class="pill r" id="p-fall" style="left: 330px; top: 800px;">IL TOMBE</div>
        <div class="pill b" id="p-grav" style="left: 560px; top: 440px;">GRAVITÉ 90 %</div>
        <div id="gauge">
          <div class="gb"><div class="gl">AU SOL</div><div class="gt"><div class="gf" id="g1" style="background:#4ade80"></div></div><div class="gv" id="gv1" style="color:#4ade80">100 %</div></div>
          <div class="gb"><div class="gl">À 400 KM</div><div class="gt"><div class="gf" id="g2" style="background:#60c8ff"></div></div><div class="gv" id="gv2" style="color:#60c8ff">90 %</div></div>
        </div>
        <div id="qmark">?</div>
        <div class="pill g" id="p-yousat" style="left: 90px; top: 110px;">LES ASTRONAUTES</div>
        <div class="pill y" id="p-canon" style="left: 640px; top: 760px;">1 · TROP FAIBLE</div>
        <div id="dip"></div>
      </div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="20" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <audio id="voix" src="assets/voix.wav" data-start="0" data-duration="20" data-track-index="9" data-volume="1"></audio>
    </div>

    <script type="importmap">{ "imports": { "three": "./lib/three/three.module.min.js" } }</script>
    <script type="module">
      import * as THREE from "three";

      // ---------- utilitaires deterministes ----------
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
      const lerp = (a, b, k) => a + (b - a) * k;
      function hash3(x, y, z, seed) { let h = (x * 374761393 + y * 668265263 + z * 2147483647 + seed * 1274126177) | 0; h = (h ^ (h >>> 13)) * 1274126177; h = h ^ (h >>> 16); return (h >>> 0) / 4294967296; }
      function vnoise(x, y, z, seed) {
        const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
        const u = smooth(xf), v = smooth(yf), w = smooth(zf);
        const c = (a, b, d) => hash3(xi + a, yi + b, zi + d, seed);
        return lerp(lerp(lerp(c(0,0,0), c(1,0,0), u), lerp(c(0,1,0), c(1,1,0), u), v), lerp(lerp(c(0,0,1), c(1,0,1), u), lerp(c(0,1,1), c(1,1,1), u), v), w);
      }
      function fbm(x, y, z, seed) { let a = 0.5, s = 0, f = 1; for (let i = 0; i < 5; i++) { s += a * vnoise(x * f, y * f, z * f, seed + i); f *= 2.05; a *= 0.5; } return s; }

      const W = 1040, H = 1030;
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x050914, 1);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, W / H, 0.05, 400);

      const R = 10;            // rayon de la Terre (echelle non respectee pour l'altitude)
      const RO = 11.5;         // rayon de l'orbite
      const SUN = new THREE.Vector3(1, 0.25, 0.55).normalize();

      // ---------- textures procedurales de la Terre ----------
      function buildEarthTextures() {
        const tw = 1024, th = 512;
        const day = document.createElement("canvas"); day.width = tw; day.height = th;
        const night = document.createElement("canvas"); night.width = tw; night.height = th;
        const dc = day.getContext("2d"), nc = night.getContext("2d");
        const di = dc.createImageData(tw, th), ni = nc.createImageData(tw, th);
        const rnd = mulberry32(7);
        for (let j = 0; j < th; j++) {
          const lat = (0.5 - (j + 0.5) / th) * Math.PI;
          for (let i = 0; i < tw; i++) {
            const lon = ((i + 0.5) / tw) * Math.PI * 2 - Math.PI;
            const x = Math.cos(lat) * Math.cos(lon), y = Math.sin(lat), z = Math.cos(lat) * Math.sin(lon);
            const n = fbm(x * 1.7 + 3, y * 1.7 + 3, z * 1.7 + 3, 11);
            const land = smooth((n - 0.5) / 0.06);
            const alat = Math.abs(lat) / (Math.PI / 2);
            const ice = smooth((alat - 0.82) / 0.08);
            const mois = fbm(x * 3 + 9, y * 3 + 9, z * 3 + 9, 31);
            // ocean
            let r = lerp(10, 26, n), g = lerp(48, 98, n), b = lerp(110, 190, n);
            // terre : vert -> sable
            const lr = lerp(70, 176, smooth((0.62 - mois) * 3)), lg = lerp(130, 150, smooth((0.62 - mois) * 3)), lb = lerp(70, 92, smooth((0.62 - mois) * 3));
            r = lerp(r, lr, land); g = lerp(g, lg, land); b = lerp(b, lb, land);
            r = lerp(r, 235, ice); g = lerp(g, 242, ice); b = lerp(b, 250, ice);
            const cl = smooth((fbm(x * 4 + 50, y * 4 + 50, z * 4 + 50, 77) - 0.56) * 6) * 0.55;
            r = lerp(r, 245, cl); g = lerp(g, 248, cl); b = lerp(b, 255, cl);
            const k = (j * tw + i) * 4;
            di.data[k] = r; di.data[k + 1] = g; di.data[k + 2] = b; di.data[k + 3] = 255;
            // nuit : lumieres de villes sur la terre
            const cityN = fbm(x * 9 + 100, y * 9 + 100, z * 9 + 100, 5);
            const lights = land > 0.5 && ice < 0.2 ? smooth((cityN - 0.64) * 14) * (0.35 + 0.4 * rnd()) : 0;
            ni.data[k] = 255 * lights; ni.data[k + 1] = 170 * lights; ni.data[k + 2] = 70 * lights; ni.data[k + 3] = 255;
          }
        }
        dc.putImageData(di, 0, 0); nc.putImageData(ni, 0, 0);
        const mk = (c) => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
        return { day: mk(day), night: mk(night) };
      }

      const earthMat = (tex) => new THREE.ShaderMaterial({
        uniforms: { dayMap: { value: tex.day }, nightMap: { value: tex.night }, sun: { value: SUN } },
        vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
          void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.); vV=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`,
        fragmentShader: `uniform sampler2D dayMap; uniform sampler2D nightMap; uniform vec3 sun; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
          void main(){
            float ndl=dot(normalize(vN),sun);
            float d=smoothstep(-0.06,0.22,ndl);
            vec3 day=texture2D(dayMap,vUv).rgb*(0.25+0.95*max(ndl,0.));
            vec3 night=texture2D(nightMap,vUv).rgb*1.9+vec3(0.012,0.02,0.05);
            vec3 col=mix(night,day,d);
            float rim=pow(1.-max(dot(normalize(vN),vV),0.),3.);
            col+=vec3(0.25,0.55,1.0)*rim*(0.12+0.5*d);
            gl_FragColor=vec4(col,1.);
          }`,
      });
      const atmoMat = new THREE.ShaderMaterial({
        uniforms: { sun: { value: SUN } },
        vertexShader: `varying vec3 vN; varying vec3 vV;
          void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.); vV=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`,
        fragmentShader: `uniform vec3 sun; varying vec3 vN; varying vec3 vV;
          void main(){ float f=pow(max(0.62-dot(normalize(vN),vV),0.),2.4)*1.5; float l=0.35+0.65*smoothstep(-0.3,0.4,dot(normalize(vN),sun));
            gl_FragColor=vec4(vec3(0.3,0.62,1.0)*f*l,f*l); }`,
        side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      });

      const tex = buildEarthTextures();
      const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), earthMat(tex));
      scene.add(earth);
      const atmo = new THREE.Mesh(new THREE.SphereGeometry(R * 1.045, 64, 48), atmoMat);
      scene.add(atmo);

      // ---------- etoiles ----------
      {
        const rnd = mulberry32(99), n = 1600, p = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) { const u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u), r = 150 + rnd() * 30; p[i*3] = r*s*Math.cos(a); p[i*3+1] = r*u; p[i*3+2] = r*s*Math.sin(a); }
        const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
        scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfe0ff, size: 0.55, sizeAttenuation: true, transparent: true, opacity: 0.8 })));
      }

      // ---------- lumieres ----------
      const sunL = new THREE.DirectionalLight(0xfff1dd, 3.0); sunL.position.copy(SUN).multiplyScalar(60); scene.add(sunL);
      scene.add(new THREE.HemisphereLight(0x5a78c8, 0x0a1022, 0.9));

      // ---------- ISS (modele simplifie) ----------
      const iss = new THREE.Group();
      {
        const white = new THREE.MeshStandardMaterial({ color: 0xe8ecf4, roughness: 0.55, metalness: 0.25 });
        const grey = new THREE.MeshStandardMaterial({ color: 0xa9b2c2, roughness: 0.5, metalness: 0.5 });
        const gold = new THREE.MeshStandardMaterial({ color: 0xd9a441, roughness: 0.4, metalness: 0.7, emissive: 0x221500 });
        const panel = new THREE.MeshStandardMaterial({ color: 0x1b3f86, roughness: 0.35, metalness: 0.6, emissive: 0x0a1a40 });
        const cyl = (r, l, m, rot) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, l, 24), m); if (rot === "x") c.rotation.z = Math.PI / 2; if (rot === "z") c.rotation.x = Math.PI / 2; return c; };
        const truss = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.08, 0.08), grey); iss.add(truss);
        const m1 = cyl(0.17, 1.1, white, "z"); m1.position.set(0, -0.05, 0); iss.add(m1);
        const m2 = cyl(0.15, 0.9, white, "z"); m2.position.set(0.22, -0.05, 0.9); iss.add(m2);
        const m3 = cyl(0.15, 0.8, white, "z"); m3.position.set(-0.22, -0.05, -0.85); iss.add(m3);
        const m4 = cyl(0.12, 0.6, gold, "x"); m4.position.set(0, -0.05, 0.1); iss.add(m4);
        const dome = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), white); dome.position.set(0, 0.16, 0.1); iss.add(dome);
        for (const sx of [-1, 1]) {
          for (const sz of [-1, 1]) {
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.02, 0.36), panel);
            p.position.set(sx * 1.2, 0, sz * 0.28 + (sz > 0 ? 0.04 : -0.04)); iss.add(p);
            const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.02, 0.36), panel);
            p2.position.set(sx * 1.2 + sx * 0.0, 0, sz * 0.28); p2.visible = false; iss.add(p2);
          }
          const rad = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 0.22), white); rad.position.set(sx * 0.55, 0.28, 0.1); rad.rotation.z = 0.0; iss.add(rad);
        }
        iss.scale.setScalar(1.25);
      }
      scene.add(iss);

      // objet qui tombe (cle a molette stylisee)
      const wrench = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.07, 0.07), new THREE.MeshStandardMaterial({ color: 0xffc247, roughness: 0.35, metalness: 0.6, emissive: 0x442a00 }));
      scene.add(wrench);

      // anneau d'orbite
      const orbitRing = (() => { const pts = []; for (let i = 0; i <= 256; i++) { const a = (i / 256) * Math.PI * 2; pts.push(new THREE.Vector3(Math.sin(a) * RO, 0, Math.cos(a) * RO)); }
        const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color: 0xfbbf24, dashSize: 0.5, gapSize: 0.35, transparent: true, opacity: 0.8 })); l.computeLineDistances(); scene.add(l); return l; })();

      // fleches de gravite
      const gravArrows = new THREE.Group();
      {
        const m = new THREE.LineBasicMaterial({ color: 0x60c8ff, transparent: true, opacity: 0.95 });
        for (let k = -2; k <= 2; k++) {
          const a = Math.PI / 180 * (k * 7), p0 = new THREE.Vector3(Math.sin(a) * (RO + 0.2), 0, Math.cos(a) * (RO + 0.2)), p1 = p0.clone().multiplyScalar((R + 0.9) / (RO + 0.2));
          gravArrows.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p0, p1]), m));
          const head = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.4, 12), new THREE.MeshBasicMaterial({ color: 0x60c8ff }));
          head.position.copy(p1).add(p0.clone().sub(p1).normalize().multiplyScalar(-0.0)); head.lookAt(p1.clone().multiplyScalar(2)); head.rotateX(Math.PI / 2); head.rotateX(Math.PI); gravArrows.add(head);
        }
      }
      scene.add(gravArrows);

      // ligne altitude (ISS -> surface)
      const altLine = (() => { const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -1, 0)]); const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xfbbf24 })); scene.add(l); return l; })();

      // ---------- astronaute ----------
      const astro = new THREE.Group();
      {
        const suit = new THREE.MeshStandardMaterial({ color: 0xf2f4f8, roughness: 0.6, metalness: 0.1 });
        const visor = new THREE.MeshStandardMaterial({ color: 0xc9902a, roughness: 0.15, metalness: 0.9, emissive: 0x2a1700 });
        const dark = new THREE.MeshStandardMaterial({ color: 0x8892a6, roughness: 0.5, metalness: 0.3 });
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.45, 0.55, 8, 20), suit); astro.add(body);
        const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.42, 28, 20), suit); helmet.position.set(0, 0.92, 0); astro.add(helmet);
        const vz = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.62), visor); vz.position.set(0, 0.94, 0.17); vz.rotation.x = Math.PI * 0.42; astro.add(vz);
        const pack = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.8, 0.3), dark); pack.position.set(0, 0.05, -0.42); astro.add(pack);
        for (const s of [-1, 1]) {
          const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.55, 6, 14), suit); arm.position.set(s * 0.62, 0.15, 0.12); arm.rotation.z = s * 0.9; arm.rotation.x = -0.4; astro.add(arm);
          const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.19, 0.6, 6, 14), suit); leg.position.set(s * 0.22, -0.95, 0.1); leg.rotation.z = s * 0.18; leg.rotation.x = -0.3; astro.add(leg);
        }
        astro.scale.setScalar(1.0);
      }
      scene.add(astro);

      // ---------- Newton : montagne + canon + boulets ----------
      const newton = new THREE.Group();
      const cannonBase = new THREE.Vector3(0, R + 0.05, 0);
      const trailMat = (c) => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0.95 });
      let trails = [], balls = [];
      {
        const rock = new THREE.MeshStandardMaterial({ color: 0x5b6b86, roughness: 0.9, metalness: 0.05, flatShading: true });
        const m = new THREE.Mesh(new THREE.ConeGeometry(1.0, 1.4, 7), rock); m.position.set(0, R + 0.35, 0); newton.add(m);
        const m2 = new THREE.Mesh(new THREE.ConeGeometry(0.7, 0.9, 6), rock); m2.position.set(-0.7, R + 0.1, 0.2); newton.add(m2);
        const cm = new THREE.MeshStandardMaterial({ color: 0x2a3140, roughness: 0.4, metalness: 0.8 });
        const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 0.62, 16), cm); cannon.position.set(0.22, R + 1.18, 0); cannon.rotation.z = -Math.PI / 2 + 0.05; newton.add(cannon);
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.05, 20), cm); wheel.rotation.x = Math.PI / 2; wheel.position.set(0.12, R + 1.1, 0); newton.add(wheel);
        // trajectoires : tir 1 (court), tir 2 (plus long)
        const shots = [{ t0: 18.75, ang: 0.08, speed: 0.34, color: 0xfbbf24 }, { t0: 21.2, ang: 0.15, speed: 0.58, color: 0x60c8ff }];
        for (const s of shots) {
          // integration simple deterministe dans le plan XY (gravite centrale)
          const pts = [], dt = 0.05; let p = new THREE.Vector2(0.3, R + 1.2), v = new THREE.Vector2(s.speed * 7, 0.0 + s.ang * 3);
          const gk = 2.4;
          for (let i = 0; i < 600; i++) {
            pts.push(new THREE.Vector3(p.x, p.y, 0));
            const r = p.length(), a = p.clone().multiplyScalar(-gk * R * R / (r * r * r));
            v.addScaledVector(a, dt); p.addScaledVector(v, dt);
            if (p.length() <= R + 0.02) { pts.push(new THREE.Vector3(p.x, p.y, 0)); break; }
          }
          s.pts = pts;
          const g = new THREE.BufferGeometry().setFromPoints(pts);
          const l = new THREE.Line(g, trailMat(s.color)); l.geometry.setDrawRange(0, 0); newton.add(l);
          const ball = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), new THREE.MeshBasicMaterial({ color: s.color })); ball.visible = false; newton.add(ball);
          trails.push({ line: l, ball, s });
        }
      }
      scene.add(newton);

      // ---------- trajectoire camera ----------
      // coordonnees locales a l'ISS : r = radial (vers le haut), t = tangent, y = axe orbital
      const ISSANG0 = 0.0, OMEGA = 0.018;
      function issAngle(t) { return ISSANG0 + OMEGA * t; }
      function basis(a) { return { r: new THREE.Vector3(Math.sin(a), 0, Math.cos(a)), t: new THREE.Vector3(Math.cos(a), 0, -Math.sin(a)), y: new THREE.Vector3(0, 1, 0) }; }
      // waypoints : [t, camR, camT, camY, lookR, lookT, lookY]
      const WP = [
        [0.0,  3.0, -9.0, 1.5,  -2.5, 0.5, 0.0],
        [3.6,  2.6, -8.0, 1.2,  -2.8, 0.3, 0.0],
        [4.2,  4.5, -11.0, 2.5, -3.0, 0.5, 0.0],
        [7.2,  7.0, -13.0, 4.0, -4.0, 0.0, 0.0],
        [8.4,  18.0, -12.0, 8.0, -6.0, 0.0, 0.0],
        [9.6,  22.0, -10.0, 8.0, -6.0, 0.0, 0.0],
        [12.8, 24.0, -6.0, 8.0, -6.0, 0.0, 0.0],
      ];
      function camAt(t) {
        let i = 0; while (i < WP.length - 2 && t > WP[i + 1][0]) i++;
        const a = WP[i], b = WP[i + 1], k = smooth((t - a[0]) / (b[0] - a[0]));
        const o = []; for (let j = 1; j < 7; j++) o.push(lerp(a[j], b[j], k)); return o;
      }

      function renderAt(time) {
        const t = time;
        const ang = issAngle(t), B = basis(ang);
        const issPos = B.r.clone().multiplyScalar(RO);
        iss.position.copy(issPos);
        iss.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(B.t, B.r, B.r.clone().cross(B.t).multiplyScalar(-1)));
        // vue "espace" (0-13 s) / astronaute (13.3-16.2) / newton (16.2-...)
        const space = t < 13.2, astroShot = t >= 13.2 && t < 16.1, newtonShot = t >= 16.1;
        iss.visible = space; orbitRing.visible = space && t > 3.6; earth.visible = !astroShot; atmo.visible = !astroShot;
        gravArrows.visible = t > 8.0 && t < 13.0; astro.visible = astroShot; newton.visible = newtonShot;
        altLine.visible = t > 1.0 && t < 4.1; wrench.visible = t > 1.5 && t < 4.1;

        if (space) {
          const c = camAt(Math.min(t, 12.8));
          const camPos = issPos.clone().addScaledVector(B.r, c[0]).addScaledVector(B.t, c[1]).addScaledVector(B.y, c[2]);
          const look = issPos.clone().addScaledVector(B.r, c[3]).addScaledVector(B.t, c[4]).addScaledVector(B.y, c[5]);
          camera.position.copy(camPos); camera.up.set(0, 1, 0); camera.lookAt(look);
          earth.rotation.y = 0.05 * t;
          // objet qui tombe : depart de l'ISS a t=1.6, chute acceleree
          if (wrench.visible) {
            const f = Math.max(0, t - 1.6); const drop = 0.5 * 0.9 * f * f;
            wrench.position.copy(issPos).addScaledVector(B.r, 0.5 - drop).addScaledVector(B.t, 0.3);
            wrench.rotation.set(f * 2.2, f * 1.3, f * 3.1);
            const gg = altLine.geometry.attributes.position; const sp = issPos.clone().addScaledVector(B.r, -0.2); const ep = issPos.clone().multiplyScalar((R + 0.1) / RO);
            gg.setXYZ(0, sp.x, sp.y, sp.z); gg.setXYZ(1, ep.x, ep.y, ep.z); gg.needsUpdate = true;
          }
          // fleches de gravite suivent l'ISS
          gravArrows.rotation.y = ang;
        } else if (astroShot) {
          const f = t - 13.2;
          camera.position.set(0, 0.2, 6.2); camera.up.set(0, 1, 0); camera.lookAt(0, 0, 0);
          astro.position.set(Math.sin(f * 0.8) * 0.5 - 0.2, 0.15 * Math.sin(f * 1.1) + 0.1, 0);
          astro.rotation.set(0.25 + 0.5 * Math.sin(f * 0.7), f * 0.55 + 0.3, 0.2 * Math.sin(f * 0.9));
        } else {
          const f = t - 16.1;
          camera.position.set(lerp(-3.5, -2.2, smooth(f / 5)), R + lerp(4.0, 3.2, smooth(f / 5)), lerp(15, 12.5, smooth(f / 5)));
          camera.up.set(0, 1, 0); camera.lookAt(lerp(2.5, 3.6, smooth(f / 5)), R - 0.8, 0);
          earth.rotation.y = 0;
          for (const tr of trails) {
            const n = tr.s.pts.length, k = clamp01((t - tr.s.t0) / 3.2);
            const idx = Math.floor(k * (n - 1));
            tr.line.geometry.setDrawRange(0, t >= tr.s.t0 ? idx + 1 : 0);
            tr.ball.visible = t >= tr.s.t0 && k < 1 + 1e-6 && t >= tr.s.t0;
            const pp = tr.s.pts[Math.min(idx, n - 1)]; tr.ball.position.set(pp.x, pp.y, pp.z);
          }
        }
        renderer.render(scene, camera);
        // reflet flou sous le cadre
        glowCtx.clearRect(0, 0, 140, 72); glowCtx.drawImage(canvas, 0, 560, 1040, 470, 0, 0, 140, 72);
      }
      const glowCtx = document.getElementById("glow").getContext("2d");

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["stage"] = Promise.resolve();
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
      window.__renderAt = renderAt;
    </script>

    <script>
      // ----- habillage 2D : pastilles, jauge, transitions -----
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, a, b) => {
        tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, a);
        tl.to(sel, { opacity: 0, duration: 0.15, ease: "power2.in" }, b - 0.15);
      };
      tl.fromTo("#tag-left, #tag-right", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.fromTo("#scale-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.4);
      tl.to("#scale-note", { opacity: 0, duration: 0.2 }, 13.0);
      pop("#p-alt", 1.6, 3.5);
      pop("#p-fall", 3.0, 4.0);
      pop("#p-grav", 9.9, 13.0);
      tl.fromTo("#gauge", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3 }, 10.4);
      tl.fromTo("#g1", { width: "0%" }, { width: "100%", duration: 0.6, ease: "power3.out" }, 10.5);
      tl.fromTo("#g2", { width: "0%" }, { width: "90%", duration: 0.7, ease: "power3.out" }, 11.3);
      tl.to("#gauge", { opacity: 0, duration: 0.2 }, 12.9);
      // astronautes flottent-ils ?
      pop("#p-yousat", 13.5, 16.0);
      tl.fromTo("#qmark", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 14.9);
      tl.to("#qmark", { opacity: 0, duration: 0.15 }, 16.0);
      pop("#p-canon", 19.0, 20);
      // fondus de plan (dip) aux changements de decor
      for (const [a, b] of [[13.05, 13.35], [15.95, 16.25]]) {
        tl.fromTo("#dip", { opacity: 0 }, { opacity: 0.9, duration: (b - a) / 2, ease: "power1.in" }, a);
        tl.to("#dip", { opacity: 0, duration: (b - a) / 2, ease: "power1.out" }, a + (b - a) / 2);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
