    <script>
      // ----- habillage 2D : pastilles (assets/pills.js), accroche, titre, comparaisons, appel a l'action, transitions -----
      const card = document.getElementById("card");
      for (const p of window.PILLS) {
        const lead = !(p.anc.k === "scr");
        if (lead) {
          const ld = document.createElement("div"); ld.className = "ld " + p.cls; ld.id = "ld-" + p.id; card.insertBefore(ld, document.getElementById("dip"));
          const ad = document.createElement("div"); ad.className = "ad " + p.cls; ad.id = "ad-" + p.id; card.insertBefore(ad, document.getElementById("dip"));
        }
        const pw = document.createElement("div"); pw.className = "pw"; pw.id = "pw-" + p.id;
        pw.innerHTML = '<span class="pill ' + p.cls + '" id="pl-' + p.id + '">' + (p.txt || "") + "</span>";
        card.insertBefore(pw, document.getElementById("dip"));
      }
      const tl = gsap.timeline({ paused: true });
      for (const p of window.PILLS) {
        tl.fromTo("#pl-" + p.id, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, p.t0);
        tl.to("#pl-" + p.id, { opacity: 0, duration: 0.15, ease: "power2.in" }, p.t1 - 0.15);
        if (p.anc.k !== "scr") {
          tl.fromTo("#ld-" + p.id + ", #ad-" + p.id, { opacity: 0 }, { opacity: 0.95, duration: 0.2 }, p.t0 + 0.05);
          tl.to("#ld-" + p.id + ", #ad-" + p.id, { opacity: 0, duration: 0.15 }, p.t1 - 0.15);
        }
      }
      for (const [a, b] of [[0.4, 1.9]]) {
        tl.to("#scale-note", { opacity: 1, duration: 0.3 }, a);
        tl.to("#scale-note", { opacity: 0, duration: 0.2 }, b);
      }
      // accroche : visible des la premiere image (miniature), puis revient en fin pour la boucle
      tl.to("#hook", { opacity: 0, duration: 0.35, ease: "power2.in" }, 3.4);
      tl.to("#hook", { opacity: 1, duration: 0.6, ease: "power2.out" }, 75.3);
      // thermometre (la planete se refroidit)
      tl.fromTo("#therm", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3 }, 50.6);
      tl.fromTo("#tf", { scaleY: 1 }, { scaleY: 0.12, duration: 3.4, ease: "power2.inOut" }, 50.8);
      tl.to("#therm", { opacity: 0, duration: 0.25 }, 54.2);
      // titre de chute
      tl.fromTo("#title", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 60.2);
      tl.to("#title", { opacity: 0, duration: 0.35 }, 63.7);
      // appel a commenter
      tl.fromTo("#cta-comment", { opacity: 0, y: 24, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 63.9);
      tl.to("#cta-comment", { opacity: 0, duration: 0.3 }, 71.5);
      // appel a s'abonner : bouton, curseur, clic, cloche
      tl.fromTo("#cta-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 66.6);
      tl.fromTo("#cursor", { opacity: 0, x: 760, y: 1000 }, { opacity: 1, x: 560, y: 900, duration: 0.9, ease: "power2.inOut" }, 67.4);
      tl.to("#sub-on", { scale: 0.93, duration: 0.1, ease: "power2.in" }, 68.4);
      tl.to("#sub-on", { opacity: 0, duration: 0.12 }, 68.5);
      tl.to("#sub-off", { opacity: 1, duration: 0.12 }, 68.5);
      tl.fromTo("#sub-off svg", { rotate: 0 }, { rotate: 18, duration: 0.08, yoyo: true, repeat: 5, ease: "sine.inOut" }, 68.65);
      tl.to("#cursor", { opacity: 0, duration: 0.25 }, 69.2);
      tl.to("#cta-sub", { opacity: 0, duration: 0.35 }, 75.0);
      tl.fromTo("#prog-fill", { width: "0px" }, { width: "520px", duration: 76, ease: "none" }, 0);
      for (const c of window.CUTS) {
        tl.fromTo("#dip", { opacity: 0 }, { opacity: 0.55, duration: 0.1, ease: "power1.in" }, c - 0.1);
        tl.to("#dip", { opacity: 0, duration: 0.2, ease: "power1.out" }, c);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "three";

      // ---------- utilitaires deterministes ----------

      const fmtInt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

      const A_FB0 = A_INIT + 2 * Math.PI - W_FB * (LOOP - FB);
      const SUN_DIR = new THREE.Vector3(1, 0.2, 0.3).normalize();

      const loadTex = (url) => texLoader.loadAsync(url).then((t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; });
      const earthUniforms = { dayMap: { value: null }, nightMap: { value: null }, sun: { value: SUN_DIR }, lit: { value: 1 } };
      const earthMat = new THREE.ShaderMaterial({
        uniforms: earthUniforms,
        vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
          void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.); vV=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`,
        fragmentShader: `uniform sampler2D dayMap; uniform sampler2D nightMap; uniform vec3 sun; uniform float lit; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
          void main(){
            vec3 n=normalize(vN); float ndl=dot(n,sun); float d=smoothstep(-0.015,0.05,ndl)*lit; float shade=0.8+0.2*smoothstep(0.12,0.4,ndl);
            vec3 col=mix(texture2D(nightMap,vUv).rgb*1.5, texture2D(dayMap,vUv).rgb*shade, d);
            float rim=pow(1.-max(dot(n,vV),0.),4.); col+=vec3(0.25,0.7,1.0)*rim*(0.06+0.3*d);

          }`,
      });
      const atmoMat = new THREE.ShaderMaterial({
        uniforms: { sun: { value: SUN_DIR }, lit: { value: 1 } },
        vertexShader: `varying vec3 vN; varying vec3 vV;
          void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.); vV=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`,
        fragmentShader: `uniform vec3 sun; uniform float lit; varying vec3 vN; varying vec3 vV;
          void main(){ float f=pow(max(0.5-dot(normalize(vN),vV),0.),3.0)*3.4; float l=(0.45+0.55*smoothstep(-0.3,0.4,dot(normalize(vN),sun)))*(0.15+0.85*lit);
            gl_FragColor=vec4(vec3(0.35,0.75,1.0)*f*l,clamp(f*l,0.,1.)); }`,
        side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      });
      const earthG = new THREE.Group(), earthTilt = new THREE.Group(); earthTilt.rotation.x = 0.5; earthG.add(earthTilt);
      const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(R, 64, 48), earthMat); earthTilt.add(earthMesh);
      earthTilt.add(new THREE.Mesh(new THREE.SphereGeometry(R * 1.035, 48, 32), atmoMat));
      earthG.scale.setScalar(0.3); scene.add(earthG);

      // Lune (a l'echelle de la mise en scene, pas du reel)

      // ---------- lumieres ----------

      const hemi = new THREE.HemisphereLight(0x8fa8ff, 0x1a2036, 1.2); scene.add(hemi);

      // ---------- fonctions de scene ----------

      const sunVisible = (t) => t < T_VANISH || t >= FB;

      // ---------- plans (camera) ----------

      const SHOTS = [
        SH(0, 7.1,     "sun",   [[0, 0, 34, 100], [7.1, -10, 28, 88]]),
        SH(7.1, 27.0,  "mid",   [[0, -10, 28, 88], [6, -35, 22, 70], [12, 10, 40, 80], [19.9, 45, 14, 62]]),
        SH(27.0, 30.2, "earth", [[0, 9, 3, 12], [3.2, 7, 2, 9]]),

        SH(35.4, 45.1, "earth", [[0, 12, 5, 16], [4, -12, 3, 16], [9.7, -9, 6, 22]]),
        SH(45.1, 49.9, "ahead", [[0, -8, 4, 20], [4.8, -8, 5, 26]], 0.3, 4000),
        SH(49.9, 54.4, "earth", [[0, 6, 2, 9], [4.5, 4, 1.2, 7]]),
        SH(54.4, 60.1, "mid",   [[0, -18, 30, 92], [5.7, -6, 26, 84]]),

      const proj = new THREE.Vector3();
      const glowCtx = document.getElementById("glow").getContext("2d");
      const bloomCv = document.getElementById("bloom"), bloomCtx = bloomCv.getContext("2d");

      const mbCv = document.getElementById("mb"), mbCtx = mbCv.getContext("2d");

      window.__dbg = { renderer, camera, scene, THREE };
